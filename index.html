<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SAINT OTTER BAR JOINT MEETING</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap">
<style>

  :root{
    --bg: #14110d;
    --bg-2: #191510;
    --surface: #1e1912;
    --surface-2: #262017;
    --ink: #f2e9d8;
    --ink-dim: #b8ab90;
    --ink-faint: #8a7d66;
    --accent: #cc9f3f;
    --accent-soft: #8a6f34;
    --accent-tint: rgba(204,159,63,0.14);
    --line: rgba(242,233,216,0.14);
    --danger: #d98a6b;
    --radius: 2px;
  }

  *,*::before,*::after{ box-sizing:border-box; }

  html,body{
    margin:0;
    padding:0;
    background:var(--bg);
    color:var(--ink);
    min-height:100%;
  }

  body{
    font-family:'Gowun Dodum','Noto Sans KR',sans-serif;
    line-height:1.7;
    -webkit-font-smoothing:antialiased;
    background:
      radial-gradient(ellipse 900px 500px at 50% -10%, rgba(204,159,63,0.10), transparent 60%),
      var(--bg);
  }

  #root{ min-height:100vh; }

  a{ color:var(--accent); }

  h1,h2,h3{
    font-family:'Gowun Batang','Noto Serif KR',serif;
    font-weight:700;
    text-wrap:balance;
    margin:0;
  }

  .en{ font-family:'Cormorant Garamond',serif; }

  .wrap{
    max-width:640px;
    margin:0 auto;
    padding:0 24px;
  }

  /* ---------- brand mark ---------- */
  .brand-mark{
    margin:0 auto;
    flex:none;
  }
  .brand-mark .brand-badge{
    display:block;
    width:148px;
    height:148px;
    border-radius:50%;
    box-shadow:0 16px 40px rgba(0,0,0,0.5), 0 0 0 1px rgba(242,233,216,0.1);
  }
  .brand-mark.sm .brand-badge{ width:112px; height:112px; }

  /* ---------- gate ---------- */
  .gate{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:48px 24px;
  }
  .gate-card{
    width:100%;
    max-width:360px;
    text-align:center;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:20px;
  }
  .gate-eyebrow{
    font-size:12px;
    letter-spacing:0.22em;
    text-transform:uppercase;
    color:var(--ink-faint);
  }
  .gate-title{
    font-size:26px;
    line-height:1.3;
  }
  .gate-copy{
    color:var(--ink-dim);
    font-size:14.5px;
    margin:0;
  }
  .gate form{
    width:100%;
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-top:4px;
  }
  .gate-error{
    color:var(--danger);
    font-size:13px;
    min-height:18px;
  }

  input[type="text"],
  input[type="password"],
  select,
  textarea{
    width:100%;
    background:var(--surface-2);
    border:1px solid var(--line);
    color:var(--ink);
    border-radius:var(--radius);
    padding:12px 14px;
    font:inherit;
    font-size:15px;
  }
  input::placeholder, textarea::placeholder{ color:var(--ink-faint); }
  input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible, a:focus-visible{
    outline:2px solid var(--accent);
    outline-offset:2px;
  }
  textarea{ resize:vertical; min-height:72px; font-family:inherit; }
  select{ cursor:pointer; }

  button{
    font:inherit;
    cursor:pointer;
    border:1px solid var(--accent-soft);
    background:var(--accent);
    color:#1a1409;
    font-weight:700;
    letter-spacing:0.03em;
    border-radius:var(--radius);
    padding:12px 18px;
    transition:filter .15s ease, transform .15s ease;
  }
  button:hover{ filter:brightness(1.08); }
  button:active{ transform:translateY(1px); }
  button.ghost{
    background:transparent;
    color:var(--accent);
  }
  button:disabled{ opacity:0.55; cursor:default; }

  /* ---------- hero ---------- */
  .hero{
    padding:56px 0 36px;
    text-align:center;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:18px;
    border-bottom:1px solid var(--line);
  }
  .eyebrow{
    font-size:12px;
    letter-spacing:0.28em;
    text-transform:uppercase;
    color:var(--accent);
  }
  .hero h1{
    font-size:clamp(28px,7vw,42px);
    letter-spacing:0.01em;
    line-height:1.15;
  }
  .hero .sub{
    font-family:'Gowun Batang','Noto Serif KR',serif;
    font-size:19px;
    color:var(--ink-dim);
  }
  .hero .sub .x{ color:var(--accent); padding:0 8px; }
  .tagline{
    max-width:420px;
    color:var(--ink-dim);
    font-size:15px;
  }

  /* ---------- divider ---------- */
  .divider{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
    color:var(--accent-soft);
    margin:40px 0;
  }
  .divider::before,.divider::after{
    content:"";
    height:1px;
    width:48px;
    background:var(--line);
  }

  /* ---------- details ---------- */
  .details{ padding:36px 0 0; }
  .detail-card{
    border:1px solid var(--line);
    background:var(--surface);
    border-radius:var(--radius);
    padding:28px 26px;
    display:flex;
    flex-direction:column;
    gap:20px;
  }
  .detail-row{
    display:flex;
    gap:18px;
  }
  .detail-label{
    flex:none;
    width:56px;
    color:var(--accent);
    font-size:12px;
    letter-spacing:0.16em;
    text-transform:uppercase;
    padding-top:3px;
  }
  .detail-value{ color:var(--ink); font-size:15.5px; }
  .detail-value .muted{ color:var(--ink-dim); font-size:13.5px; display:block; margin-top:4px; }
  .detail-value a{ font-size:13.5px; }

  /* ---------- intro ---------- */
  .intro{ text-align:center; padding:0 0; }
  .intro h2{ font-size:22px; margin-bottom:14px; }
  .intro p{ color:var(--ink-dim); font-size:15px; max-width:480px; margin:0 auto; }

  /* ---------- form ---------- */
  .form-section{ padding-top:44px; }
  .form-section h2{ font-size:22px; text-align:center; margin-bottom:6px; }
  .form-section .form-caption{
    text-align:center;
    color:var(--ink-dim);
    font-size:14px;
    margin:0 0 22px;
  }
  .card-form{
    border:1px solid var(--line);
    background:var(--surface);
    border-radius:var(--radius);
    padding:26px;
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .field label{
    display:block;
    font-size:12.5px;
    letter-spacing:0.05em;
    color:var(--ink-dim);
    margin-bottom:6px;
  }
  .field-row{ display:flex; gap:12px; }
  .field-row .field{ flex:1; min-width:0; }
  .field-actions{ display:flex; gap:10px; align-items:center; }
  .field-actions button{ flex:none; }
  .form-status{
    font-size:13.5px;
    min-height:18px;
    color:var(--ink-dim);
  }
  .form-status.err{ color:var(--danger); }
  .form-status.ok{ color:var(--accent); }

  .fallback-box{
    margin-top:6px;
    border:1px dashed var(--accent-soft);
    background:var(--accent-tint);
    border-radius:var(--radius);
    padding:16px;
    font-size:13.5px;
    color:var(--ink-dim);
    display:none;
    flex-direction:column;
    gap:10px;
    white-space:pre-wrap;
  }
  .fallback-box.show{ display:flex; }
  .fallback-box textarea{ background:var(--surface-2); font-size:13px; }

  /* ---------- guestbook ---------- */
  .guestbook{ padding-top:44px; padding-bottom:64px; }
  .guestbook h2{ font-size:22px; text-align:center; }
  .guestbook .count{ color:var(--accent); }
  .gb-empty{
    text-align:center;
    color:var(--ink-faint);
    font-size:14px;
    padding:32px 0;
    border:1px dashed var(--line);
    border-radius:var(--radius);
    margin-top:20px;
  }
  .gb-body{
    margin-top:24px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
    align-items:start;
  }
  .gb-col{
    display:flex;
    flex-direction:column;
    gap:16px;
    min-width:0;
  }
  .gb-col-title{
    font-family:'Gowun Batang','Noto Serif KR',serif;
    font-size:15px;
    color:var(--accent);
    text-align:center;
    letter-spacing:0.04em;
    padding-bottom:10px;
    border-bottom:1px solid var(--line);
  }
  .gb-col .gb-empty{
    margin-top:0;
    padding:22px 10px;
    font-size:13px;
  }
  .gb-card{
    --card-bg: #f4ecd8;
    --card-ink: #241f1a;
    --card-ink-dim: #766a55;
    --card-link: #8a5a1f;
    background:var(--card-bg);
    color:var(--card-ink);
    border-top:3px solid var(--accent);
    border-radius:5px;
    padding:16px 18px 14px;
    display:flex;
    flex-direction:column;
    gap:8px;
    box-shadow:0 10px 22px rgba(0,0,0,0.35), 0 0 0 1px rgba(20,17,13,0.08);
  }
  .gb-name{
    font-family:'Gowun Batang','Noto Serif KR',serif;
    font-weight:700;
    font-size:17px;
    color:var(--card-ink);
  }
  .gb-insta{ font-size:13.5px; }
  .gb-insta a{ color:var(--card-link); text-decoration:none; }
  .gb-insta a:hover{ text-decoration:underline; }
  .gb-msg{
    font-size:13.5px;
    color:var(--card-ink-dim);
    font-style:italic;
    border-top:1px dashed rgba(20,17,13,0.16);
    padding-top:8px;
    margin-top:2px;
  }
  .gb-actions{
    display:flex;
    gap:14px;
    padding-top:4px;
  }
  .gb-action{
    background:none;
    border:none;
    padding:0;
    font-size:12px;
    letter-spacing:0.02em;
    color:rgba(36,31,26,0.5);
    text-decoration:underline;
    text-underline-offset:2px;
  }
  .gb-action:hover{ color:var(--card-link); }

  footer{
    text-align:center;
    padding:0 24px 56px;
    color:var(--ink-faint);
    font-size:12.5px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
  }
  .admin-link{
    background:none;
    border:none;
    padding:0;
    font-size:11.5px;
    color:var(--ink-faint);
    text-decoration:underline;
    text-underline-offset:2px;
    opacity:0.7;
  }
  .admin-link:hover{ opacity:1; color:var(--accent); }

  @media (max-width:420px){
    .field-row{ flex-direction:column; }
    .detail-label{ width:44px; font-size:11px; }
  }

  @media (max-width:480px){
    .gb-body{ grid-template-columns:1fr; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; animation:none !important; }
  }

</style>
</head>

  var ENTRIES = [];

  // ============================================================

  // ============================================================

  function escapeHtml(str){
    return String(str == null ? "" : str).replace(/[&<>"']/g, function(c){
      return ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" })[c];
    });
  }

  function normalizeInstagram(raw){
    if (!raw) return null;
    var v = String(raw).trim();
    if (!v) return null;
    var m = v.match(/instagram\.com\/([^\/\?\s]+)/i);
    var handle;
    if (m) { handle = m[1]; }
    else { handle = v.replace(/^@/, "").replace(/^https?:\/\//i, ""); }
    handle = handle.replace(/\/+$/, "");
    if (!handle) return null;
    return { handle: handle, url: "https://instagram.com/" + handle };
  }

  function canEditEntry(e){
    return !!(currentUid && e.ownerUid === currentUid) || isAdminFlag;
  }

  function findEntry(id){
    for (var i = 0; i < ENTRIES.length; i++){ if (ENTRIES[i].id === id) return ENTRIES[i]; }
    return null;
  }

  function brandMarkHTML(size){
    var cls = size === "sm" ? " sm" : "";
    return ''
      + '<div class="brand-mark' + cls + '">'
      +   '<img class="brand-badge" src="' + BRAND_BADGE + '" alt="Saint Otter Bar">'
      + '</div>';
  }

  function gateHTML(errorMsg){
    return ''
      + '<div class="gate">'
      +   '<div class="gate-card">'
      +     brandMarkHTML("sm")
      +     '<div class="gate-eyebrow">JOINT MEETING</div>'
      +     '<p class="gate-copy">초대받은 분들만 들어올 수 있는 페이지예요.<br>공지받은 접속 코드를 입력해주세요.</p>'
      +     '<form id="gate-form" autocomplete="off">'
      +       '<input type="password" id="gate-input" placeholder="접속 코드" inputmode="text" required>'
      +       '<div class="gate-error">' + escapeHtml(errorMsg || "") + '</div>'
      +       '<button type="submit">입장하기</button>'
      +     '</form>'
      +   '</div>'
      + '</div>';
  }

  function formHTML(){
    var editing = editingId ? findEntry(editingId) : null;
    var heading = editing ? "연락처 수정하기" : "연락처 남기기";

    var aff1Selected = editing && editing.affiliation === AFFILIATIONS[1] ? " selected" : "";

    var editable = canEditEntry(e);
    return ''
      + '<div class="gb-card">'
      +   '<div class="gb-name">' + escapeHtml(e.nickname) + '</div>'
      +   (insta ? '<div class="gb-insta"><a href="' + insta.url + '" target="_blank" rel="noopener">@' + escapeHtml(insta.handle) + '</a></div>' : '')
      +   (e.message ? '<div class="gb-msg">“' + escapeHtml(e.message) + '”</div>' : '')
      +   (editable
          ? '<div class="gb-actions">'
            + '<button type="button" class="gb-action" data-action="edit" data-id="' + e.id + '">수정</button>'
            + '<button type="button" class="gb-action" data-action="delete" data-id="' + e.id + '">삭제</button>'
            + '</div>'
          : '')
      + '</div>';
  }

  function guestColumnHTML(label, entries){
    var ordered = entries.slice().reverse();
    var body = entries.length
      ? ordered.map(guestCardHTML).join("")
      : '<div class="gb-empty">아직 없어요</div>';
    return ''
      + '<div class="gb-col">'
      +   '<div class="gb-col-title">' + escapeHtml(label) + ' <span class="en">' + entries.length + '</span></div>'
      +   body
      + '</div>';
  }

  function guestbookHTML(entries){
    var groupA = entries.filter(function(e){ return e.affiliation === AFFILIATIONS[0]; });
    var groupB = entries.filter(function(e){ return e.affiliation === AFFILIATIONS[1]; });
    return ''
      + '<h2>먼저 도착한 사람들 <span class="count en">' + entries.length + '</span></h2>'
      + '<div class="gb-body">'
      +   guestColumnHTML(AFFILIATIONS[0], groupA)
      +   guestColumnHTML(AFFILIATIONS[1], groupB)
      + '</div>';
  }

  function shellHTML(){
    return ''
      + '<header class="hero">'
      +   brandMarkHTML()
      +   '<div class="eyebrow">JOINT MEETING</div>'
      +   '<div class="sub">동의모 <span class="x">×</span> 회계사</div>'
      +   '<p class="tagline">새로운 인연을 만나는 자리.<br>모임 전후로 서로의 인스타를 남기고 미리 인사해보세요.</p>'
      + '</header>'
      + detailsHTML()
      + '<div class="divider wrap">◆</div>'
      + '<section class="intro wrap">'
      +   '<h2>모임 전과 후, 인스타로 인사해요</h2>'
      +   '<p>모든 정보 제공은 optional 입니다! 안 남기셔도 무방합니다 ;)</p>'
      + '</section>'
      + formHTML()
      + '<section class="guestbook wrap" id="gb-root">' + guestbookHTML(ENTRIES) + '</section>'
      + '<footer>'
      +   '<div>SAINT OTTER BAR JOINT MEETING · 즐거운 자리에서 만나요</div>'
      +   '<button type="button" id="admin-toggle" class="admin-link">' + (isAdminFlag ? "관리자 모드 종료" : "관리자이신가요?") + '</button>'
      + '</footer>';
  }

  // ============================================================
  // 4) RENDER + EVENTS
  //    Two render paths on purpose: a full shell re-render (user
  //    actions: unlock, edit, cancel, admin login) vs. a guestbook-
  //    only re-render (live updates from OTHER people's activity),
  //    so a live update never wipes out what you're mid-typing.
  // ============================================================

  function renderShell(){
    document.getElementById("root").innerHTML = unlocked ? shellHTML() : gateHTML(gateError);
    attachShellHandlers();
    attachGuestbookHandlers();
  }

  function renderGuestbook(){
    var gb = document.getElementById("gb-root");
    if (!gb) return; // gate still showing, nothing to update yet
    gb.innerHTML = guestbookHTML(ENTRIES);
    attachGuestbookHandlers();
  }

  function attachShellHandlers(){
    var gateForm = document.getElementById("gate-form");
    if (gateForm){
      gateForm.addEventListener("submit", function(ev){
        ev.preventDefault();
        var val = document.getElementById("gate-input").value.trim().toLowerCase();
        if (val === ACCESS_CODE.toLowerCase()){
          unlocked = true;
          try { sessionStorage.setItem("som-unlocked", "1"); } catch(e){}
          gateError = "";
          renderShell();
        } else {
          gateError = "코드가 맞지 않아요. 다시 확인해주세요.";
          renderShell();
        }
      });
    }

    var entryForm = document.getElementById("entry-form");
    if (entryForm){
      entryForm.addEventListener("submit", function(ev){
        ev.preventDefault();
        submitEntry();
      });
    }

    var copyBtn = document.getElementById("f-copy");
    if (copyBtn){
      copyBtn.addEventListener("click", function(){
        var text = document.getElementById("f-fallback-text").value;
        if (navigator.clipboard && navigator.clipboard.writeText){
          navigator.clipboard.writeText(text).then(function(){
            copyBtn.textContent = "복사됨!";
            setTimeout(function(){ copyBtn.textContent = "복사하기"; }, 1600);
          });
        }
      });
    }

    var cancelEditBtn = document.getElementById("f-cancel-edit");
    if (cancelEditBtn){
      cancelEditBtn.addEventListener("click", function(){
        editingId = null;
        renderShell();
      });
    }

    var adminToggle = document.getElementById("admin-toggle");
    if (adminToggle){
      adminToggle.addEventListener("click", function(){
        if (isAdminFlag){
          isAdminFlag = false;
          renderShell();
          return;
        }
        var code = window.prompt("관리자 코드를 입력해주세요.");
        if (code === null) return;
        if (!db || !currentUid){
          window.alert("아직 연결 중이에요. 잠시 후 다시 시도해주세요.");
          return;
        }
        db.collection("admins").doc(currentUid).set({
          code: code.trim(),
          grantedAt: firebase.firestore.FieldValue.serverTimestamp()
        }).then(function(){
          isAdminFlag = true;
          renderShell();
        }).catch(function(){
          window.alert("코드가 맞지 않아요.");
        });
      });
    }
  }

  function attachGuestbookHandlers(){
    var gbButtons = document.querySelectorAll(".gb-action");
    gbButtons.forEach(function(btn){
      btn.addEventListener("click", function(){
        var id = btn.getAttribute("data-id");
        var action = btn.getAttribute("data-action");
        if (action === "edit"){
          editingId = id;
          renderShell();
          var formSection = document.querySelector(".form-section");
          if (formSection && typeof formSection.scrollIntoView === "function"){
            formSection.scrollIntoView({ behavior: "smooth", block: "start" });
          }
        } else if (action === "delete"){
          if (!window.confirm("정말 삭제할까요? 이 작업은 되돌릴 수 없어요.")) return;
          deleteEntry(id);
        }
      });
    });
  }

  function setStatus(msg, kind){
    var el = document.getElementById("f-status");
    if (!el) return;
    el.textContent = msg || "";
    el.className = "form-status" + (kind ? " " + kind : "");
  }

  function showFallback(entry){
    var box = document.getElementById("f-fallback");
    var ta = document.getElementById("f-fallback-text");
    if (!box || !ta) return;
    var insta = normalizeInstagram(entry.instagram);
    ta.value = "닉네임: " + entry.nickname
      + "\n소속: " + entry.affiliation
      + (insta ? "\n인스타: @" + insta.handle : "")
      + (entry.message ? "\n하고 싶은 말: " + entry.message : "");
    box.className = "fallback-box show";
  }

  function readForm(){
    return {
      nickname: document.getElementById("f-nickname").value.trim(),
      affiliation: document.getElementById("f-affiliation").value.trim(),
      instagram: document.getElementById("f-instagram").value.trim(),
      message: document.getElementById("f-message").value.trim()
    };
  }

  // ============================================================
  // 5) DATA — Firestore reads/writes
  // ============================================================

  function submitEntry(){
    var fields = readForm();
    if (!fields.nickname || !fields.affiliation){
      setStatus("닉네임과 소속은 꼭 남겨주세요.", "err");
      return;
    }
    document.getElementById("f-fallback").className = "fallback-box";

    if (!db || !currentUid){
      setStatus("", "");
      showFallback(fields);
      return;
    }

    var submitBtn = document.getElementById("f-submit");
    submitBtn.disabled = true;
    setStatus("저장하는 중...", "");

    var editing = editingId ? findEntry(editingId) : null;

    if (editing){
      db.collection("entries").doc(editing.id).update({
        nickname: fields.nickname,
        affiliation: fields.affiliation,
        instagram: fields.instagram,
        message: fields.message
      }).then(function(){
        editingId = null;
        renderShell();
      }).catch(function(){
        submitBtn.disabled = false;
        setStatus("수정에 실패했어요. 잠시 후 다시 시도해주세요.", "err");
      });
      return;
    }

    db.collection("entries").add({
      nickname: fields.nickname,
      affiliation: fields.affiliation,
      instagram: fields.instagram,
      message: fields.message,
      ownerUid: currentUid,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    }).then(function(){
      var form = document.getElementById("entry-form");
      if (form) form.reset();
      submitBtn.disabled = false;
      setStatus("남겨주셔서 감사해요!", "ok");
    }).catch(function(){
      submitBtn.disabled = false;
      setStatus("", "");
      showFallback(fields);
    });
  }

  function deleteEntry(id){
    if (!db){
      window.alert("아직 연결 중이에요. 잠시 후 다시 시도해주세요.");
      return;
    }
    if (editingId === id) editingId = null;
    db.collection("entries").doc(id).delete().then(function(){
      renderShell();
    }).catch(function(){
      window.alert("삭제에 실패했어요. 잠시 후 다시 시도해주세요.");
    });
  }

  function listenEntries(){
    db.collection("entries").orderBy("createdAt", "asc").onSnapshot(function(snap){
      ENTRIES = snap.docs.map(function(d){
        var data = d.data();
        data.id = d.id;
        return data;
      });
      renderGuestbook();
    }, function(err){
      console.error("entries listener error", err);
    });
  }

  // ============================================================
  // 6) BOOT
  // ============================================================

  try {
    unlocked = sessionStorage.getItem("som-unlocked") === "1";
  } catch(e){ unlocked = false; }
  renderShell();

  var configured = window.firebase && FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.apiKey.indexOf("REPLACE_WITH") === -1;
  if (!configured){
    console.warn("FIREBASE_CONFIG is still using placeholder values — fill it in before sharing this link.");
  } else {
    firebase.initializeApp(FIREBASE_CONFIG);
    db = firebase.firestore();

    firebase.auth().onAuthStateChanged(function(user){
      if (!user) return;
      currentUid = user.uid;
      db.collection("admins").doc(currentUid).get().then(function(doc){
        isAdminFlag = !!(doc && doc.exists);
        renderShell();
      }).catch(function(){ /* not signed in as admin — fine */ });
      listenEntries();
    });

    firebase.auth().signInAnonymously().catch(function(err){
      console.error("anonymous sign-in failed", err);
    });
  }
})();
</script>
</body>
</html>
